      <circle cx="940" cy="220" r="2" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="3.3s" begin="-1.9s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="168" r="2" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="3.6s" begin="-2.2s" repeatCount="indefinite"/></circle>
