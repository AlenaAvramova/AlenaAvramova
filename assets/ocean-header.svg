      <circle cx="520" cy="215" r="2.5" opacity="0"><animate attributeName="opacity" values="0;0.85;0" dur="3s" begin="-0.6s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="185" r="2" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="2.8s" begin="-1.7s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="230" r="3" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="-0.3s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="178" r="2.5" opacity="0"><animate attributeName="opacity" values="0;0.85;0" dur="3.1s" begin="-2.4s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="232" r="2" opacity="0"><animate attributeName="opacity" values="0;0.75;0" dur="2.9s" begin="-1.4s" repeatCount="indefinite"/></circle>
