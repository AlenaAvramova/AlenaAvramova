<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Alena Avramova - Engineering Student and Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#10264f"/>
      <stop offset="1" stop-color="#17489f"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
